<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">
  <title>Image: 1.44 MB boot floppy with kernel and root file system</title>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Image  =  one 1.44 MB floppy (make)</text>
  <text x="430" y="48" text-anchor="middle" fill="#666">scale: 1 px = 2 KB  (1474560 bytes = FLOPPY_DISK_SIZE, sparse file)</text>

  <!-- scale: x = 40 + KB/2 ; 1440 KB -> 720 px wide (40..760) -->
  <g stroke="#555" stroke-width="1">
    <rect x="40"  y="80" width="4"   height="70" fill="#9ec5ea"/>   <!-- bootsect 0.5 KB -->
    <rect x="44"  y="80" width="4"   height="70" fill="#6fa8dc"/>   <!-- setup 2 KB -->
    <rect x="48"  y="80" width="62"  height="70" fill="#93c47d"/>   <!-- kernel ~127 KB -->
    <rect x="110" y="80" width="58"  height="70" fill="#f3f3f3"/>   <!-- gap to 256 KB -->
    <rect x="168" y="80" width="512" height="70" fill="#f6b26b"/>   <!-- rootfs 1024 KB -->
    <rect x="680" y="80" width="80"  height="70" fill="#f3f3f3"/>   <!-- unused -->
  </g>

  <!-- offsets -->
  <g fill="#333" font-size="11" text-anchor="middle">
    <text x="40"  y="168">0</text>
    <text x="110" y="168">~130 KB</text>
    <text x="168" y="168">256 KB</text>
    <text x="680" y="168">1280 KB</text>
    <text x="760" y="168">1440 KB</text>
  </g>

  <!-- legend instead of leader lines (the first parts are only a few px wide) -->
  <g fill="#222" font-size="11">
    <rect x="40"  y="186" width="12" height="12" fill="#9ec5ea" stroke="#555"/><text x="58"  y="196">bootsect, sector 1 (512 B, 0xAA55, root dev at 508)</text>
    <rect x="370" y="186" width="12" height="12" fill="#6fa8dc" stroke="#555"/><text x="388" y="196">setup, sectors 2-5 (2 KB)</text>
    <rect x="560" y="186" width="12" height="12" fill="#93c47d" stroke="#555"/><text x="578" y="196">system: head.s + kernel (gcc 9.4.0)</text>
  </g>
  <g fill="#222">
    <text x="176" y="106" font-size="12" font-weight="bold">rootfs.img (MINIX v1, 1024 blocks = RAM disk size)</text>
    <text x="176" y="124" font-size="11">/bin/sh /bin/hello /usr/bin/ls,cat (a.out), /bin/busybox /bin/hello-elf (ELF)</text>
    <text x="176" y="140" font-size="11">/dev/tty0 /etc/rc</text>
    <text x="672" y="140" font-size="11" text-anchor="end">489 of 1024 blocks free</text>
  </g>

  <!-- what happens at boot -->
  <g fill="#333" font-size="12">
    <text x="40" y="226">bootsect.s reads sectors 1..: setup to 0x90200, system to 0x10000 (setup moves it to 0).</text>
    <text x="40" y="246">rd_load() (RAMDISK=1024, ROOT_DEV=FLOPPY) finds the MINIX superblock at block 256, copies the</text>
    <text x="40" y="266">file system into the 1 MB RAM disk at 0x400000 and mounts it as root (0x101).</text>
  </g>

  <!-- the programs and how they were built -->
  <rect x="40" y="286" width="720" height="140" fill="#fdf2e6" stroke="#f6b26b"/>
  <g fill="#222" font-size="11">
    <text x="52" y="306" font-size="12" font-weight="bold">Programs in rootfs.img</text>
    <text x="52" y="326" font-weight="bold">a.out ZMAGIC, 0.11 libc</text>
    <text x="236" y="326">/bin/sh (bash), /usr/bin/ls, /usr/bin/cat: rootfs-bin/, from oldlinux-0.11 hdc-0.11.img</text>
    <text x="236" y="342">/bin/hello: tools/hello.s + tools/mkaout.py ("hello from userspace", then pause)</text>
    <text x="52" y="366" font-weight="bold">static i386 ELF, linked at 0</text>
    <text x="236" y="366">/bin/busybox: rootfs-bin/busybox, Buildroot 2025.02 oldlinux_i386_busybox_defconfig</text>
    <text x="248" y="382" font-family="DejaVu Sans Mono, monospace">BusyBox v1.37.0 (2026-11-05 17:23:10 CST, gcc 13.3.0, uClibc-ng 1.0.59)</text>
    <text x="236" y="402">/bin/hello-elf: tools/hello-elf.c, host gcc, no libc</text>
    <text x="248" y="418" font-family="DejaVu Sans Mono, monospace">hello from a static ELF program, built &lt;make date&gt; with gcc 9.4.0</text>
  </g>
</svg>
