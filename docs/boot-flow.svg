<svg xmlns="http://www.w3.org/2000/svg" width="860" height="660" viewBox="0 0 860 660" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <title>Linux 0.11 boot flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="860" height="660" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Linux 0.11 boot flow (gcc9-minimal)</text>
  <text x="430" y="50" text-anchor="middle" font-size="12" fill="#666">left: what runs, CPU mode and address  -  right: what it prints / what to break on in gdb</text>

  <!-- stage boxes -->
  <g stroke="#555" stroke-width="1.2">
    <rect x="40" y="70"  width="440" height="62" rx="8" fill="#eeeeee"/>
    <rect x="40" y="152" width="440" height="78" rx="8" fill="#dbe9f7"/>
    <rect x="40" y="250" width="440" height="92" rx="8" fill="#dbe9f7"/>
    <rect x="40" y="362" width="440" height="78" rx="8" fill="#dff0dc"/>
    <rect x="40" y="460" width="440" height="62" rx="8" fill="#dff0dc"/>
    <rect x="40" y="542" width="440" height="78" rx="8" fill="#fbe8d3"/>
  </g>

  <g fill="#222">
    <text x="56" y="94" font-weight="bold">BIOS (SeaBIOS)</text>
    <text x="56" y="114">reset entry f000:fff0, loads floppy sector 1 to 0x7c00</text>

    <text x="56" y="176" font-weight="bold">boot/bootsect.s   (16-bit, real mode)</text>
    <text x="56" y="196">runs at 0x7c00, copies itself to 0x90000, loads setup (4 sectors)</text>
    <text x="56" y="214">to 0x90200 and the system to 0x10000, jumps to 0x9020:0000</text>

    <text x="56" y="274" font-weight="bold">boot/setup.s   (16-bit, real mode)</text>
    <text x="56" y="294">saves BIOS data at 0x90000 (cursor, memory, disks),</text>
    <text x="56" y="312">moves the system from 0x10000 to 0, lidt/lgdt, A20,</text>
    <text x="56" y="330">8259s, lmsw (PE=1), ljmp $8,$0 -&gt; 32-bit, address 0</text>

    <text x="56" y="386" font-weight="bold">boot/head.s   startup_32   (32-bit, address 0)</text>
    <text x="56" y="406">own GDT (_gdt) and IDT (_idt), page tables at 0x1000-0x4000,</text>
    <text x="56" y="424">16 MB identity mapped, CR3=0, PG=1, calls main()</text>

    <text x="56" y="484" font-weight="bold">init/main.c   main()   (kernel, ring 0)</text>
    <text x="56" y="504">mem/trap/blk/chr/tty/sched init, move_to_user_mode(), fork()</text>

    <text x="56" y="566" font-weight="bold">init()  -&gt;  /bin/sh   (task 1, ring 3)</text>
    <text x="56" y="586">setup(): RAM disk loaded from the floppy, root = 0x101,</text>
    <text x="56" y="604">opens /dev/tty0, execve("/bin/sh")  =  bash from rootfs-bin/</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#444" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="250" y1="132" x2="250" y2="150"/>
    <line x1="250" y1="230" x2="250" y2="248"/>
    <line x1="250" y1="342" x2="250" y2="360"/>
    <line x1="250" y1="440" x2="250" y2="458"/>
    <line x1="250" y1="522" x2="250" y2="540"/>
  </g>

  <!-- right column: output and breakpoints -->
  <g font-size="12" fill="#333">
    <text x="510" y="94" font-weight="bold" fill="#222">screen / gdb</text>
    <text x="510" y="114">gdb (-S): stopped at cs=0xf000 eip=0xfff0</text>

    <text x="510" y="190" font-family="DejaVu Sans Mono, monospace">Loading system ...</text>
    <text x="510" y="208" font-family="DejaVu Sans Mono, monospace">Jumping to setup ...</text>
    <text x="510" y="226" fill="#1a5fa8">gdb: hbreak *0x7c00</text>

    <text x="510" y="290" font-family="DejaVu Sans Mono, monospace">Now we are in setup ...</text>
    <text x="510" y="308" font-family="DejaVu Sans Mono, monospace">Entering protected mode ...</text>
    <text x="510" y="326" fill="#1a5fa8">gdb: hbreak *0x90200</text>

    <text x="510" y="404" fill="#1a5fa8">gdb / VS Code: hbreak startup_32</text>
    <text x="510" y="422" fill="#1a5fa8">(boot/head.s with source lines, as -g)</text>

    <text x="510" y="484" font-family="DejaVu Sans Mono, monospace">Linux 0.11 built ... with gcc 9.4.0</text>
    <text x="510" y="502" fill="#1a5fa8">break init/main.c:131  or  break _main</text>

    <text x="510" y="566" font-family="DejaVu Sans Mono, monospace">Loading 524288 bytes into ram disk</text>
    <text x="510" y="584" font-family="DejaVu Sans Mono, monospace">bash#</text>
    <text x="510" y="602" fill="#a85a1a">user code: base = task nr x 64 MB</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#444">
    <rect x="40" y="634" width="12" height="12" fill="#dbe9f7" stroke="#555"/><text x="58" y="644">16-bit real mode</text>
    <rect x="170" y="634" width="12" height="12" fill="#dff0dc" stroke="#555"/><text x="188" y="644">32-bit kernel (ring 0)</text>
    <rect x="330" y="634" width="12" height="12" fill="#fbe8d3" stroke="#555"/><text x="348" y="644">user mode (ring 3)</text>
    <text x="510" y="644" fill="#1a5fa8">blue: gdb breakpoints</text>
  </g>
</svg>
