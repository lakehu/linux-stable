<text x="380" y="17" fill="#eeeeec" text-anchor="middle" style="font-size:12px">Linux 0.11 (elf-uclibc): static ELF BusyBox from the RAM disk</text>
<text class="r0" x="16" y="54" fill="#8ae234">$ make run          # QEMU, VGA text console in the terminal</text>
<text class="r1" x="16" y="71" fill="#a8b8c8">Linux 0.11 built Nov  5 2026 17:44:55 with gcc 9.4.0</text>
<text class="r2" x="16" y="88" fill="#a8b8c8">Ram disk: 1048576 bytes, starting at 0x400000</text>
<text class="r3" x="16" y="105" fill="#a8b8c8">Loading 1048576 bytes into ram disk... done</text>
<text class="r4" x="16" y="122" fill="#a8b8c8">489/1024 free blocks</text>
<text class="r5" x="16" y="139" fill="#a8b8c8">17/32 free inodes</text>
<text class="r6" x="16" y="156" fill="#a8b8c8">3449 buffers = 3531776 bytes buffer space</text>
<text class="r7" x="16" y="173" fill="#a8b8c8">Free mem: 11403264 bytes</text>
<text class="r8" x="16" y="190" fill="#fce94f">bash# busybox | busybox head -n 1</text>
<text class="r9" x="16" y="207" fill="#d3d7cf">BusyBox v1.37.0 (2026-11-05 17:23:10 CST, gcc 13.3.0, uClibc-ng 1.0.59) multi-ca</text>
<text class="r10" x="16" y="224" fill="#d3d7cf">ll binary.</text>
<text class="r11" x="16" y="241" fill="#fce94f">bash# busybox uname -a</text>
<text class="r12" x="16" y="258" fill="#d3d7cf">Linux (none) 0.11 Nov  5 2026 17:44:56 i386</text>
<text class="r13" x="16" y="275" fill="#fce94f">bash# busybox ls -l /bin</text>
<text class="r14" x="16" y="292" fill="#d3d7cf">-rwxr-xr-x    1 0        0           152560 Jan  1  1970 busybox</text>
<text class="r15" x="16" y="309" fill="#d3d7cf">-rwxr-xr-x    1 0        0             5120 Jan  1  1970 hello</text>
<text class="r16" x="16" y="326" fill="#d3d7cf">-rwxr-xr-x    1 0        0             8996 Jan  1  1970 hello-elf</text>
<text class="r17" x="16" y="343" fill="#d3d7cf">-rwxr-xr-x    1 0        0           283652 Jan  1  1970 sh</text>
<text class="r18" x="16" y="360" fill="#fce94f">bash# hello-elf a b | busybox head -n 3</text>
<text class="r19" x="16" y="377" fill="#d3d7cf">hello from a static ELF program, built Nov  5 2026 17:44:59 with gcc 9.4.0</text>
<text class="r20" x="16" y="394" fill="#d3d7cf">edx at entry: 0</text>
<text class="r21" x="16" y="411" fill="#d3d7cf">argc: 3</text>
<text class="r22" x="16" y="428" fill="#fce94f">bash# busybox cp /etc/rc /r; busybox ls -l /r</text>
<text class="r23" x="16" y="445" fill="#d3d7cf">-rw-r--r--    1 0        0               47 Nov  5 09:47 /r</text>
<text class="r24" x="16" y="462" fill="#fce94f">bash# busybox cat /r | busybox wc -c; busybox rm /r</text>
<text class="r25" x="16" y="479" fill="#d3d7cf">47</text>
<text class="r26" x="16" y="496" fill="#fce94f">bash# busybox seq 3 | busybox sort -r</text>
<text class="r27" x="16" y="513" fill="#d3d7cf">3</text>
<text class="r28" x="16" y="530" fill="#d3d7cf">2</text>
<text class="r29" x="16" y="547" fill="#d3d7cf">1</text>
<text class="r30" x="16" y="564" fill="#d3d7cf">bash#</text>
<text class="r31" x="16" y="581" fill="#fce94f">bash# </text>
