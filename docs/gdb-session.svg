<text x="450" y="19" text-anchor="middle" fill="#cccccc" style="font-size:12px">gdb - Linux 0.11 in QEMU (make debug)</text>
<text class="r0" x="18" y="54" fill="#8ae234">$ make debug            # terminal 1: QEMU waits with -S -gdb tcp::41234</text>
<text class="r1" x="18" y="71" fill="#8ae234">$ gdb -nx tools/system   # terminal 2</text>
<text class="r2" x="18" y="88" fill="#fce94f">(gdb) target remote :41234</text>
<text class="r3" x="18" y="105" fill="#888a85"># connected: CPU stopped at the reset entry (real mode: the name hd_out is a gdb artefact)</text>
<text class="r4" x="18" y="122" fill="#d3d7cf">0x0000fff0 in hd_out (drive=0, nsect=0, sect=0, head=0, cyl=0, cmd=0, intr_addr=0x0 &lt;startup_32&gt;) at hd.c:203</text>
<text class="r5" x="18" y="139" fill="#d3d7cf">203             outb_p(hd_info[drive].wpcom&gt;&gt;2,++port);</text>
<text class="r6" x="18" y="156" fill="#fce94f">(gdb) hbreak startup_32</text>
<text class="r7" x="18" y="173" fill="#d3d7cf">Hardware assisted breakpoint 1 at 0x0: file boot/head.s, line 18.</text>
<text class="r8" x="18" y="190" fill="#fce94f">(gdb) continue</text>
<text class="r9" x="18" y="207" fill="#d3d7cf">Breakpoint 1, startup_32 () at boot/head.s:18</text>
<text class="r10" x="18" y="224" fill="#d3d7cf">18              movl $0x10,%eax</text>
<text class="r11" x="18" y="241" fill="#fce94f">(gdb) next</text>
<text class="r12" x="18" y="258" fill="#d3d7cf">19              mov %ax,%ds</text>
<text class="r13" x="18" y="275" fill="#fce94f">(gdb) next</text>
<text class="r14" x="18" y="292" fill="#d3d7cf">20              mov %ax,%es</text>
<text class="r15" x="18" y="309" fill="#fce94f">(gdb) break init/main.c:131</text>
<text class="r16" x="18" y="326" fill="#d3d7cf">Breakpoint 2 at 0x67d5: file init/main.c, line 131.</text>
<text class="r17" x="18" y="343" fill="#fce94f">(gdb) continue</text>
<text class="r18" x="18" y="360" fill="#d3d7cf">Breakpoint 2, main () at init/main.c:131</text>
<text class="r19" x="18" y="377" fill="#d3d7cf">131             printk(&quot;Linux 0.11 built %s %s with gcc %s\n\r&quot;, __DATE__, __TIME__, __VERSION__);</text>
<text class="r20" x="18" y="394" fill="#fce94f">(gdb) next</text>
<text class="r21" x="18" y="411" fill="#d3d7cf">132             time_init();</text>
<text class="r22" x="18" y="428" fill="#fce94f">(gdb) print memory_end</text>
<text class="r23" x="18" y="445" fill="#d3d7cf">$1 = 16777216</text>
<text class="r24" x="18" y="462" fill="#fce94f">(gdb) info registers cr0 cs</text>
<text class="r25" x="18" y="479" fill="#d3d7cf">cr0            0x80000013          [ PG ET MP PE ]</text>
<text class="r26" x="18" y="496" fill="#d3d7cf">cs             0x8                 8</text>
<text class="r27" x="18" y="513" fill="#fce94f">(gdb) bt</text>
<text class="r28" x="18" y="530" fill="#d3d7cf">#0  main () at init/main.c:132</text>
<text class="r29" x="18" y="547" fill="#d3d7cf">#1  0x00005412 in after_page_tables () at boot/head.s:141</text>
<text class="r30" x="18" y="564" fill="#d3d7cf">#2  0x00000000 in ?? ()</text>
<text class="r31" x="18" y="581" fill="#d3d7cf">Backtrace stopped: previous frame inner to this frame (corrupt stack?)</text>
